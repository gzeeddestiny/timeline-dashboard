name: V2 acceptance
on:
  pull_request:
    paths: ['index.html', 'src/lib/**', 'src/components/**', 'api/**', 'test/**', 'src/v2/**', 'v2/**', 'e2e/**', 'supabase/migrations/*timeline_v2*', 'package*.json', 'vite.config.js', 'vercel.json', 'playwright.config.js', 'scripts/verify-v2-build.mjs', 'scripts/patch-fullcalendar.mjs', 'docs/v2-legacy-baseline.json', '.github/workflows/v2.yml']
  push:
    branches: [main]
    paths: ['index.html', 'src/lib/**', 'src/components/**', 'api/**', 'test/**', 'src/v2/**', 'v2/**', 'e2e/**', 'supabase/migrations/*timeline_v2*', 'package*.json', 'vite.config.js', 'vercel.json', 'playwright.config.js', 'scripts/verify-v2-build.mjs', 'scripts/patch-fullcalendar.mjs', 'docs/v2-legacy-baseline.json', '.github/workflows/v2.yml']
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run security:scan
      - run: npm run build
      - run: node scripts/verify-v2-build.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: v2-browser-traces
          path: test-results/
